name: pr-text

# CLAUDE.md says no tool branding in commits, branches or PRs, and nothing
# measured it: the commit-msg hook only runs where it is installed, and no
# check read a PR body at all. A squash merge here writes every commit message
# of the PR into main (squash_merge_commit_message: COMMIT_MESSAGES), so a
# trailer that slips through stays in the history for good.
#
# This job reads the title, the body and every commit message of the PR, and
# fails on a session link or an attribution line. `edited` re-runs it when the
# body is fixed, without re-running the whole gate.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signatures:
    name: pr-text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the commits between the base and the head
          persist-credentials: false
      - name: No tool signature in the title, body or commits
        # Passed through env, never interpolated into the script: the text is
        # written by whoever opens the PR.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # A co-author is an attribution when its ADDRESS is a tool's, never
        # because its name starts like one: "Claude Dupont" is a person.
        run: |
          pattern='claude\.ai/code|chatgpt\.com/codex|generated (with|by)[^a-z0-9]{0,4}(claude|codex|chatgpt|github copilot|copilot|cursor)|co-authored-by:[^<]*<[^>]*(@anthropic\.com|@openai\.com|@cursor\.(com|sh)|copilot@users\.noreply\.github\.com)>|noreply@anthropic\.com|claude-session:'
          # The detector proves itself before it judges anything.
          for sample in 'Generated by **Claude**' 'Generated by GitHub Copilot' \
            'Generated with [Claude Code](https://claude.com/claude-code)' \
            'Co-Authored-By: Claude <noreply@anthropic.com>' \
            'Co-authored-by: Cursor <cursoragent@cursor.com>' \
            'Co-authored-by: Copilot <175728472+Copilot@users.noreply.github.com>'; do
            printf '%s\n' "$sample" | grep -Eiq "$pattern" || { echo "::error::the pattern misses: $sample"; exit 1; }
          done
          for sample in 'Co-authored-by: Claude Dupont <claude.dupont@example.org>' \
            'docs: compare with codex-style notebooks'; do
            if printf '%s\n' "$sample" | grep -Eiq "$pattern"; then echo "::error::the pattern refuses: $sample"; exit 1; fi
          done
          found=0
          check() {
            if printf '%s\n' "$2" | grep -Eiq "$pattern"; then
              echo "::error::$1 carries a tool signature:"
              printf '%s\n' "$2" | grep -Ein "$pattern"
              found=1
            fi
          }
          check "The PR title" "$TITLE"
          check "The PR body" "$BODY"
          # Assigned first: inside the for list, a failed rev-list left an
          # empty list and the job green with no commit read.
          shas=$(git rev-list "$BASE..$HEAD")
          for sha in $shas; do
            check "Commit $sha" "$(git log -1 --format=%B "$sha")"
          done
          exit "$found"
