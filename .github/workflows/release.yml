name: Release

# Tag and publish a GitHub Release from the changelog, on demand. Exists because
# tags cannot always be pushed from every environment; the runner holds the write
# token, so a dispatch turns a merged release commit into a tag + Release without a
# local tag push. Idempotent: a version already released keeps its tag untouched,
# and its notes are refreshed from the current changelog section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.0.6). A leading v is accepted.
        required: true
      sha:
        description: Commit SHA to tag. Defaults to the dispatched ref.
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release is cut with gh and its own token; git never pushes here.
          persist-credentials: false
      - name: Resolve the target commit and the version
        id: target
        run: |
          sha="${{ inputs.sha }}"
          [ -z "$sha" ] && sha="${{ github.sha }}"
          # Expand to a full commit sha: the release API rejects abbreviated ones.
          sha=$(git rev-parse "${sha}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Typing the tag rather than the version is a reflex, and it used to
          # cost a red run: the changelog heading reads "## [1.8.11]", so a
          # dispatch on "v1.8.11" looked for a section that cannot exist. The
          # prefix is absorbed here, once, for every step that follows.
          version="${{ inputs.version }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Extract the changelog section
        run: |
          version="${{ steps.target.outputs.version }}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section for [$version]." >&2
            exit 1
          fi
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.target.outputs.version }}"
          sha="${{ steps.target.outputs.sha }}"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; refreshing its notes from the changelog."
            gh release edit "v$version" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file RELEASE_NOTES.md
            exit 0
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "v$version" \
            --notes-file RELEASE_NOTES.md
