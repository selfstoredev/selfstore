name: Release

# Tag and publish a GitHub Release from the changelog, on demand. Exists because
# tags cannot always be pushed from every environment; the runner holds the write
# token, so a dispatch turns a merged release commit into a tag + Release without a
# local tag push. Idempotent: a version already released keeps its tag untouched,
# and its notes are refreshed from the current changelog section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.0.6). A leading v is accepted.
        required: true
      sha:
        description: Commit SHA to tag. Defaults to the dispatched ref.
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish from CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release is cut with gh and its own token; git never pushes here.
          persist-credentials: false
      # EVERY dispatched value reaches the shell through `env`, never through
      # `${{ }}` inside a `run:` block. The difference is not cosmetic: an
      # expression is SUBSTITUTED into the script before bash reads it, so a
      # value carrying a quote and a semicolon becomes a command, in a job that
      # holds a write token. An `env` entry is passed as data and `"$SHA"` stays
      # one argument whatever it contains. Found on 2026-08-06 by Sonar rule
      # githubactions:S7630, as two high findings on a public repository.
      - name: Resolve the target commit and the version
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          sha="$INPUT_SHA"
          [ -z "$sha" ] && sha="$DEFAULT_SHA"
          # Expand to a full commit sha: the release API rejects abbreviated ones.
          sha=$(git rev-parse "${sha}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Typing the tag rather than the version is a reflex, and it used to
          # cost a red run: the changelog heading reads "## [1.8.11]", so a
          # dispatch on "v1.8.11" looked for a section that cannot exist. The
          # prefix is absorbed here, once, for every step that follows.
          echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Extract the changelog section
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          version="$VERSION"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section for [$version]." >&2
            exit 1
          fi
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          version="$VERSION"
          sha="$SHA"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; refreshing its notes from the changelog."
            gh release edit "v$version" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file RELEASE_NOTES.md
            exit 0
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "v$version" \
            --notes-file RELEASE_NOTES.md
