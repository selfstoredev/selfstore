name: publish

# Publish to npm when a GitHub Release is published. Creating the release in the
# UI also creates the tag, so the whole release is one action.
#
# The dispatch exists because that trigger has a blind spot: release.yml creates
# the release with the automatic GITHUB_TOKEN, and events raised by that token
# never start another workflow (GitHub's recursion guard). So the whole
# tag-from-changelog path - the documented way to release here - could never
# reach npm, and every publish had to be done by hand. Dispatch with the tag to
# publish it; the checkout resolves the tag rather than the default branch.
#
# Authenticated by OIDC (npm trusted publishing), not by a secret: npmjs.com
# names this repository and this workflow file as allowed to publish the
# package. Renaming this file, or moving the job to another workflow, revokes
# that permission until the trusted publisher is updated to match.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, with the v prefix (e.g. v1.5.0).
        required: true

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a release event the default checkout is already the tagged commit.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1+, and Node 20 ships npm 10. Raising
      # the npm CLI rather than the Node version keeps the runtime this package
      # is tested against unchanged - `engines` is what promises Node 20, and a
      # publish job is not the place to start testing a different one.
      #
      # Pinned exactly, and installed without its lifecycle scripts: this is the
      # tool that signs the artefact and speaks for this repository to the
      # registry. A floating range would let a release be minted by a version
      # nobody chose, and `--ignore-scripts` keeps the install itself from
      # running code that was never reviewed here.
      - run: npm install -g --ignore-scripts npm@11.19.0
      - run: npm ci --ignore-scripts
      # The one mistake this cannot take back. A version is never unpublished,
      # so a tag dispatched by hand that disagrees with the tree burns a number:
      # either the wrong commit goes out under the right name, or the release PR
      # never landed and npm rejects it after the whole gate has run. Two
      # seconds, before anything else, on both triggers - `github.ref_name` is
      # the tag on a release event.
      - name: The tag and package.json agree
        run: |
          tagged="${{ inputs.tag || github.ref_name }}"
          tagged="${tagged#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $tagged, package.json $declared - one of them is wrong."
            exit 1
          fi
      # No token. The registry decides whether this workflow, on this
      # repository, may publish this package - configured once on npmjs.com
      # under the package's Settings, and revocable there without touching a
      # secret here.
      #
      # It replaces a token rather than joining it, because the token path is
      # closing: npm now refuses account changes and direct publishing from the
      # granular tokens that bypass two-factor auth, and classic automation
      # tokens can no longer be created at all. A token in this file would be a
      # credential to rotate, leak or let expire - and an expired one publishes
      # nothing while the job reports success.
      #
      # OIDC also subsumes what `--provenance` needed the `id-token` permission
      # for: the attestation and the authorisation now come from the same
      # signed claim about this run.
      - name: Publish
        run: |
          # `npm publish` runs prepublishOnly (typecheck + test + build) first.
          npm publish --provenance --access public
