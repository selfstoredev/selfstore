# SonarCloud, for the parts of it the repo can state itself rather than a
# dashboard nobody reads in a review.
#
# READ THIS BEFORE TRUSTING IT: this project is on SonarCloud's AUTOMATIC
# analysis, which does NOT read this file - only a scanner run does. So the
# exclusion below is the intention, written where a reviewer can see it, and the
# same setting has to be entered once in the project's Analysis Scope page
# (Duplication exclusions) for the check to stop failing. Whoever moves this
# project to a scanner in CI gets it for free.

sonar.projectKey=selfstoredev_selfstore2
sonar.organization=selfstoredev
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# The widgets are exempt from the duplication metric, and the reason is the
# contract rather than convenience. Every widget colocates its own copy - EN
# defaults plus a pack per language, in its own file, so one key can read
# differently in two widgets (see CLAUDE.md). Sonar matches the SHAPE of those
# label tables, so `status`, `share` and every widget that will ever be added
# duplicate each other by construction. Extracting them to satisfy the metric
# would break the rule that produced them.
#
# This exempts the shape, not the logic: jscpd still runs over the whole repo in
# the local gate and in CI, and it is what catches a real copy-paste - it caught
# one in the destination widget the day this line was written.
sonar.cpd.exclusions=src/widgets/**
