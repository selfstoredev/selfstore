# The file SonarCloud's AUTOMATIC analysis actually reads.
#
# The name matters and nothing warns about it: `sonar-project.properties` (next
# to this one) is read by a SCANNER run, and automatic analysis ignores it in
# silence - the settings look applied and are not. This project runs automatic
# analysis, so what has to hold at review time belongs here.
#
# Keep the two files in step. sonar-project.properties carries the reasoning
# and the scanner-only keys; this one carries what automatic analysis honours.

# The widgets are exempt from the duplication metric, and the reason is the
# contract rather than convenience. Every widget colocates its own copy - EN
# defaults plus a pack per language, in its own file, so that one key can read
# differently in two widgets (see CLAUDE.md). Sonar matches the SHAPE of those
# tables across files and calls it duplication; merging them to satisfy the
# metric would break the rule the tables exist for. The logic between the
# widgets is deduplicated for real - the store, the glyphs and the host lookup
# live in base.ts - and that part is not excluded.
sonar.cpd.exclusions=src/widgets/**

# The conformance vectors are DATA, and two of their fields are named
# `password` and `secret` on purpose. `spec/vectors/manifest.json` is the
# corpus a third-party implementation reads to check its own reader against the
# archive format: the passphrase is the xkcd one and `secretB64` is base64 of
# thirty-two asterisks, both published so the sample archives next to them can
# actually be opened. Sonar read the field NAMES and raised S6418 (high) and
# S2068 on 2026-09-01; both were dismissed as false positives, and this line
# stops them coming back on the next analysis. It excludes fixtures, never
# code: `src` is untouched, and gitleaks still reads the whole history.
sonar.exclusions=spec/vectors/**
